name: security-pipeline-demo

# Full demo pipeline (synthetic/sample data only). Each testing method mirrors the real one:
#   SAST (Bandit) · SCA (pip-audit) · DAST (authenticated checks vs a running app) ·
#   FUZZ (malformed input) · ASA (surface/headers) · Closed-Box (CVE funnel) · SRT/TMT (recipes).
# All feed ONE ledger -> reports -> register -> traceability (last), committed back to the repo.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install scanners + deps
        run: pip install openpyxl bandit pip-audit

      - name: Discovery scans (SAST, then start app for DAST/FUZZ/ASA, then SCA/Closed-Box)
        env:
          DAST_PASS: ${{ secrets.DAST_PASS }}   # app test-account password (Secret); falls back to demo default
        run: |
          set -e
          # --- SAST (static, real Bandit) ---
          python -m bandit -r sample_app/app.py -f json -o bandit.json -q || true
          python pipeline/normalize_bandit.py bandit.json > sast_findings.json
          # --- start the sample app for dynamic tests ---
          python sample_app/webapp.py 8099 & APP=$!; sleep 2
          # --- DAST (authenticated), FUZZ, ASA (app running) ---
          python dast/run_dast.py  --url http://127.0.0.1:8099 --out dast_findings.json || true
          python fuzz/run_fuzz.py  --url http://127.0.0.1:8099 --out fuzz_findings.json || true
          python asa/run_asa.py    --url http://127.0.0.1:8099 --out asa_findings.json  || true
          kill $APP 2>/dev/null || true
          # --- SCA (real pip-audit) + Closed-Box funnel (static) ---
          python sca/run_sca.py --out sca_findings.json || true
          python closedbox/run_cbt.py --sca sca_findings.json --out cbt_findings.json || true
          # --- combine all findings ---
          python -c "import json;a=[];[a.extend(json.load(open(f))) for f in ['sast_findings.json','dast_findings.json','fuzz_findings.json','asa_findings.json','sca_findings.json','cbt_findings.json']];json.dump(a,open('all_findings.json','w'))"
          python -c "import json,collections;print('findings:',dict(collections.Counter(x['type'] for x in json.load(open('all_findings.json')))))"

      - name: SRT / TMT compliance tests (recipe suite)
        run: python pipeline/run_compliance.py --out "$GITHUB_WORKSPACE/compliance_results.json"

      - name: Pipeline — all findings + SRT/TMT -> ledger -> verify
        run: |
          python pipeline/run_pipeline.py \
            --findings all_findings.json \
            --compliance "$GITHUB_WORKSPACE/compliance_results.json" \
            --out-dir "$GITHUB_WORKSPACE"

      - name: DOCUMENTS — 8 reports -> register -> traceability (last)
        run: python pipeline/build_docs.py --ledger output/ledger.jsonl --out-dir output/docs

      - name: Commit generated document set back to the repo
        run: |
          git config user.name "secops-bot"
          git config user.email "secops-bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Update document set from pipeline run [skip ci]"; git push; fi

      - name: Upload full document set
        uses: actions/upload-artifact@v4
        with:
          name: document-set
          path: |
            output/docs/*.xlsx
            output/ledger.jsonl
