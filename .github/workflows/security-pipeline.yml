name: security-pipeline-demo

# Demonstration pipeline. Runs a REAL SAST scan (Bandit) on the intentionally-vulnerable
# sample_app/, plus an SSH compliance test against a throwaway container, fills the register
# TEMPLATE, saves the generated register + ledger under output/ and commits them back to the
# repo, and uploads them as artifacts. Sample code only — not a real product.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the generated register back into the repo

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners + deps
        run: pip install openpyxl bandit

      - name: SAST scan (Bandit) on the sample application
        run: |
          python -m bandit -r sample_app -f json -o bandit.json -q || true
          python pipeline/normalize_bandit.py bandit.json > pipeline/scan_findings.json
          echo "Findings:"; python -c "import json;print(len(json.load(open('pipeline/scan_findings.json'))))"

      - name: SSH compliance test (ephemeral key + throwaway container)
        continue-on-error: true
        run: |
          chmod +x scripts/ssh_compliance_test.sh
          scripts/ssh_compliance_test.sh "$GITHUB_WORKSPACE"

      - name: Pipeline — fill template -> output/register.xlsx + ledger, verify
        run: |
          python pipeline/run_pipeline.py \
            --findings pipeline/scan_findings.json \
            --host-results "$GITHUB_WORKSPACE/host_results.json" \
            --out-dir "$GITHUB_WORKSPACE"

      - name: Commit generated register back to the repo
        run: |
          git config user.name "secops-bot"
          git config user.email "secops-bot@users.noreply.github.com"
          git add output/register.xlsx output/ledger.jsonl pipeline/scan_findings.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Update risk register from pipeline run [skip ci]"
            git push
          fi

      - name: Upload evidence (register + ledger + raw scan)
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: |
            output/register.xlsx
            output/ledger.jsonl
            bandit.json
            host_results.json
