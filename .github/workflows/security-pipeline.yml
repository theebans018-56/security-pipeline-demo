name: security-pipeline-demo

# Demonstration pipeline (synthetic/sample data only — not a real product).
# Builds the FULL document set from one scan, in dependency order:
#   reports (SCA/SAST/DAST/FUZZ/ASA/SRT/TMT) -> risk register -> traceability (last),
# saves them under output/docs and commits them back to the repo.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners + deps
        run: pip install openpyxl bandit

      - name: SAST scan (Bandit) + combine findings (SAST + synthetic SCA/DAST/FUZZ/ASA)
        run: |
          python -m bandit -r sample_app -f json -o bandit.json -q || true
          python pipeline/normalize_bandit.py bandit.json > sast_findings.json
          python -c "import json;a=json.load(open('sast_findings.json'));b=json.load(open('pipeline/sample_findings.json'));json.dump(a+b,open('all_findings.json','w'),indent=1);print('combined findings:',len(a+b))"

      - name: SRT / TMT compliance tests (recipe suite)
        run: |
          python pipeline/run_compliance.py --out "$GITHUB_WORKSPACE/compliance_results.json"

      - name: SSH compliance test (ephemeral key + throwaway container)
        continue-on-error: true
        run: |
          chmod +x scripts/ssh_compliance_test.sh
          scripts/ssh_compliance_test.sh "$GITHUB_WORKSPACE"

      - name: Pipeline — scan + SRT/TMT -> ledger -> verify
        run: |
          python pipeline/run_pipeline.py \
            --findings all_findings.json \
            --host-results "$GITHUB_WORKSPACE/host_results.json" \
            --compliance "$GITHUB_WORKSPACE/compliance_results.json" \
            --out-dir "$GITHUB_WORKSPACE"

      - name: DOCUMENTS — build each report, then register, then traceability (LAST)
        run: |
          python pipeline/build_docs.py --ledger output/ledger.jsonl --out-dir output/docs

      - name: Commit generated document set back to the repo
        run: |
          git config user.name "secops-bot"
          git config user.email "secops-bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Update document set from pipeline run [skip ci]"
            git push
          fi

      - name: Upload document set + evidence
        uses: actions/upload-artifact@v4
        with:
          name: document-set
          path: |
            output/docs/*.xlsx
            output/ledger.jsonl
            bandit.json
            compliance_results.json
            host_results.json
